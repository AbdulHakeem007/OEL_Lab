{% extends "base.html" %}
{% load static %}
{% block  %}{{title}}{% endblock  %}{{title}}
{% blockcontent %}
<section class="hero">
    <div class "hero-content">
      <h1>I am <span class="highligt">{{name}}</span></h1>
      <p class ="hero-subtite">Softaware Engineer</p>
      <a href="{%url 'contact'%}" class="btn btn-primary">Contact Here</a>
    </div>
</section>

<section class="section">
    <h2>Skill</h2>
    <div class="skills-grid">
    {%for skill in skills%}
    <span class="skill-badge">{{skill}}</span>
    {% endfor %}
</dir>
</section>

<section class="section">
    <h2>Project</h2>
    <div class="projects-grid">
    {%for project in projects%}
    <div class="project-card" data-aos="fade-up">
    <h3>{{project.name}}</h3>
    <p>{{project.desc}}</p>
    </div>
    {% endfor %}
</dir>
</section>
